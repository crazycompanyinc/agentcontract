[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcontract"
version = "2.0.0"
description = "Intent-first inter-agent coordination protocol for multi-agent systems."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AgentContract Contributors" }]
dependencies = [
  "click>=8.1",
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.6",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
agentcontract = "agentcontract.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["agentcontract*"]
